services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////app/datos/datos.db
    volumes:
      - ./datos:/app/datos
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped
  puente:
    build: .
    command: python puente.py
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - broker
      - api
    restart: unless-stopped
